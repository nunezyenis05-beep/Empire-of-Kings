name: Deploy Private 3D Studio UI
on:
  push:
    branches: [main]
    paths:
      - 'aetherfall_project_2026_08_11/private_3d_studio/**'
      - '.github/workflows/private-3d-studio-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'aetherfall_project_2026_08_11/private_3d_studio'
      - id: deployment
        uses: actions/deploy-pages@v4

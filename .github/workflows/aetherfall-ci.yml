name: Build Aetherfall APK from validated snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download validated project snapshot
        run: |
          curl -L --fail --retry 3 'https://share.zapia.com/ymzn6hmb7ulhw5d6at6n0g' -o /tmp/empire-of-kings.zip
          mkdir -p project
          unzip -q /tmp/empire-of-kings.zip -d project
          test -f project/Empire-of-Kings/gradlew
          chmod +x project/Empire-of-Kings/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build and test
        working-directory: project/Empire-of-Kings
        run: ./gradlew test assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-debug-apk
          path: project/Empire-of-Kings/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-test-reports
          path: |
            project/Empire-of-Kings/app/build/reports/**
            project/Empire-of-Kings/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

name: Build Aetherfall APK from validated project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project directory
        run: |
          test -f aetherfall_project_2026_08_11/gradlew
          test -f aetherfall_project_2026_08_11/gradle.properties
          chmod +x aetherfall_project_2026_08_11/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build and test
        working-directory: aetherfall_project_2026_08_11
        run: ./gradlew test assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-debug-apk
          path: aetherfall_project_2026_08_11/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-test-reports
          path: |
            aetherfall_project_2026_08_11/app/build/reports/**
            aetherfall_project_2026_08_11/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

name: Android beta build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify-and-package:
    name: Verify and package beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Sync verified local project snapshot
        run: |
          curl -L --fail 'https://share.zapia.com/pzft5xciiu4f1stcx4wxl6' -o project_snapshot.zip
          rm -rf app gradle gradle.properties build.gradle.kts settings.gradle.kts gradlew gradlew.bat
          unzip -oq project_snapshot.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Inspect project snapshot
        run: |
          test -d app/src/main
          find app/src/main/assets/models/avatars -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload verified beta APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-kings-beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

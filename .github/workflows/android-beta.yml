name: Android beta build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify-and-package:
    name: Verify and package beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore 3D test assets
        run: |
          mkdir -p app/src/main/assets/models/avatars
          curl -L --fail 'https://share.zapia.com/9fv5m1jirz5i431ict5o84' -o app/src/main/assets/models/avatars/maya.glb
          curl -L --fail 'https://share.zapia.com/ku8jwqxzj19jcj419lsy5z' -o app/src/main/assets/models/avatars/maya_with_fox_ears_test.glb

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload verified beta APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-kings-beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

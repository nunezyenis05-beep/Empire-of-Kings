name: Private 3D Studio backend

on:
  push:
    branches: [main]
    paths:
      - 'aetherfall_project_2026_08_11/private_3d_studio/**'
      - '.github/workflows/private-3d-studio-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./aetherfall_project_2026_08_11/private_3d_studio
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/empire-of-kings-private-3d-studio:latest

name: Android beta build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify-and-package:
    name: Verify and package beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Android project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew test assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload verified beta APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-kings-beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

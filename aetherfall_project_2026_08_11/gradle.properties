# Project-wide Gradle settings.
# Android Studio / CI should run the Gradle daemon with JDK 17 for AGP 9.
# This heap is intentionally not sandbox-sized: Compose + Room/KSP + Firebase need
# enough memory to resolve and compile their dependency graph reliably.
org.gradle.jvmargs=-Xmx2048m -Xss512k -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Keep configuration cache off for maximum compatibility with the applied build plugins.
org.gradle.configuration-cache=false
org.gradle.workers.max=2

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
# Keep generated R classes namespaced.
android.nonTransitiveRClass=true
# Compile Kotlin in-process to avoid a second compiler daemon on constrained machines.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work when google-services.json is not present.
googleServices.missing.passthrough=true
# AGP 9 built-in Kotlin compatibility: allow KSP-generated source directories.
android.disallowKotlinSourceSets=false
